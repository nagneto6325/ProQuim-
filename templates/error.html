<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Denegado — ProQuim</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-bg">
  <!-- pagina de error 403, se muestra cuando un usuario intenta entrar a una seccion sin permiso -->
  <div class="login-card" style="text-align:center;max-width:480px;">
    <div style="width:72px;height:72px;border-radius:20px;background:#fef2f2;display:inline-flex;align-items:center;justify-content:center;font-size:2rem;color:var(--danger);margin-bottom:20px;">
      <i class="fas fa-lock"></i>
    </div>
    <h2 style="font-size:1.4rem;font-weight:800;color:#1e293b;margin-bottom:8px;">Acceso Denegado</h2>
    <!-- el mensaje cambia segun el rol que no tiene permiso -->
    <p style="color:#64748b;font-size:14px;margin-bottom:28px;">{{ mensaje }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="border-radius:14px;justify-content:center;">
      <i class="fas fa-arrow-left"></i> Volver al Dashboard
    </a>
  </div>
</body>
</html>
