<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProQuim — Iniciar Sesión</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-bg">
  <!-- pantalla de login, cualquier usuario puede entrar con credenciales reales -->
  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-icon"><i class="fas fa-flask"></i></div>
      <h1>ProQuim</h1>
      <p>Sistema de Gestión de Producción</p>
    </div>

    <!-- muestra error si las credenciales son incorrectas -->
    {% if error %}
    <div class="login-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" placeholder="Ingresa tu usuario" required
               value="{{ request.form.get('username', '') }}" autofocus>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
      </button>
    </form>

    <!-- credenciales de prueba para facilitar las pruebas -->
    <div class="login-hint">
      <strong>Usuarios de prueba:</strong><br>
      admin/admin123 · jefe/jefe123 · operario/operario123
    </div>

  </div>
</body>
</html>
